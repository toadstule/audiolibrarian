[build-system]
build-backend = "uv_build"
requires = ["uv_build<0.13"]

[dependency-groups]
dev = [
    "coverage>=7.15",
    "import-linter>=2.13",
    "mkdocs-material>=9.7",
    "mkdocs>=1.6",
    "mkdocstrings[python]>=1.0",
    "mypy>=2.3",
    "pymarkdownlnt>=0.9",
    "pytest-env>=1.7",
    "pytest-mock>=3.15",
    "pytest-vcr>=1.0",
    "pytest>=9.1",
    "ruff>=0.16",
    "types-pyyaml>=6.0",
    "types-requests>=2.33",
    "types-setuptools>=83.0",
    "uv-build>=0.12",
]

[project]
authors = [{name = "Steve Jibson", email = "steve@jibson.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Monitoring",
]
description = "Manage my audio library."
dependencies = [
    "ansicolors>=1.1",
    "attrs>=26.1",
    "discid>=1.4",
    "ffmpeg-normalize>=1.41",
    "filelock>=3.32",
    "fuzzywuzzy>=0.18",
    "musicbrainzngs>=0.7",
    "mutagen>=1.48",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-levenshtein>=0.27",
    "pyyaml>=6.0",
    "requests>=2.34",
    "xdg-base-dirs>=6.0",
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
name = "audiolibrarian"
readme = "README.md"
requires-python = ">=3.12"
version = "0.18.0"

[project.scripts]
audiolibrarian = "audiolibrarian.entrypoints.cli:main"

[project.urls]
Repository = "https://github.com/toadstule/audiolibrarian"

[tool.importlinter]
root_package = "audiolibrarian"

[[tool.importlinter.contracts]]
name = "layer-dependency-rule"
type = "layers"
layers = [
    "audiolibrarian.presentation",
    "audiolibrarian.infrastructure",
    "audiolibrarian.application",
    "audiolibrarian.domain",
    "audiolibrarian.common",
]
container = "audiolibrarian"

[[tool.importlinter.contracts]]
name = "domain-layer-dependency-rule"
type = "layers"
layers = [
    "audiolibrarian.domain.services",
    "audiolibrarian.domain.model",
]
container = "audiolibrarian.domain"

[[tool.importlinter.contracts]]
name = "domain-model-layer-dependency-rule"
type = "layers"
layers = [
    "audiolibrarian.domain.model.release",
    "audiolibrarian.domain.model.medium",
    "audiolibrarian.domain.model.track",
    "audiolibrarian.domain.model.values",
    "audiolibrarian.domain.model.enums",
    "audiolibrarian.domain.model.record",
]
container = "audiolibrarian.domain"

[tool.mypy]
ignore_missing_imports = true
implicit_reexport = true
install_types = true
no_strict_optional = true  # All of our record fields default to None.
non_interactive = true
pretty = true
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "picard_src.*"
ignore_errors = true  # This is not our code.

[tool.pymarkdown]
plugins.md013.line_length = 100
plugins.md013.code_block_line_length = 100
plugins.md024.enabled = false
#plugins.md007.enabled = true
#plugins.md007.code_block_line_length = 160

[tool.ruff]
extend-exclude = [
    "picard_src",  # This is not our code.
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "COM812",  # This gets upset when there isn't a trailing comma in a multi-line split string.
               # The formatter will add/verify the trailing commas.
    "T201",    # This check prevents the use of print() -- which would be fine for non-interactive programs.
]
select = [
    "ALL",  # All the checks.
    "D401"  # Use imparative mood for comments. The "google" pydocstyle convention disables this, so we'll re-enable it.
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = [
    "PLR2004",  # Allow tests to use magic numbers.
    "S101",  # Allow tests to use assert statements.
    "SLF001",  # Allow tests to access private members.
]

[tool.ruff.lint.pydocstyle]
convention = "google"
